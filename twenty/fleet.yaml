defaultNamespace: cosign-system

helm:
  releaseName: policy-controller
  chart: https://github.com/sigstore/helm-charts.git//charts/policy-controller?ref=main


diff:
  comparePatches:
    - apiVersion: "admissionregistration.k8s.io/v1"
      kind: "MutatingWebhookConfiguration"
      name: "policy.sigstore.dev"
      operations:
        - op: "remove"
          path: "/webhooks/0/clientConfig/caBundle"
        - op: "remove"
          path: "/webhooks/0/rules"
    - apiVersion: "admissionregistration.k8s.io/v1"
      kind: "ValidatingWebhookConfiguration"
      name: "policy.sigstore.dev"
      operations:
        - op: "remove"
          path: "/webhooks/0/clientConfig/caBundle"
        - op: "remove"
          path: "/webhooks/0/rules"
